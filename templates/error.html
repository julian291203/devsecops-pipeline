
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }} | Secure Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 450px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 55px;
            color: #ef4444;
        }

        p {
            color: #64748b;
            margin: 15px 0 25px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="error-box">
        <h1>{{ error_code }}</h1>

        <h2>Something went wrong</h2>

        <p>{{ error_message }}</p>

        <a href="{{ url_for('index') }}">
            Back to Login
        </a>
    </div>

</body>
</html>
